name: web

on:
  pull_request:
    # openapi.json: an API-only change must still prove the web client builds against it.
    paths: ["apps/web/**", "apps/api/openapi.json", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/api/openapi.json", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Build CI hanya memverifikasi kompilasi; origin asli di-set di Vercel.
          MOVON_API_ORIGIN: http://127.0.0.1:8000
