services:
  postgres:
    image: postgres:18-alpine
    environment: {POSTGRES_DB: movon, POSTGRES_USER: movon, POSTGRES_PASSWORD: movon}
    # PG18 images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent.
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U movon -d movon"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: ../../apps/api
    ports: ["8000:8000"]
    environment:
      MOVON_CORS_ORIGINS: '["http://localhost:3000"]'
      MOVON_DATABASE_URL: postgresql+psycopg://movon:movon@postgres:5432/movon
    depends_on: {postgres: {condition: service_healthy}}
  web:
    build:
      context: ../../apps/web
      args: {MOVON_API_ORIGIN: http://api:8000}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
