[project]
name = "teamku-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "argon2-cffi>=25.1.0",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "psycopg[binary]>=3.3.6,<4",
    "alembic>=1.20.0,<2",
    "resend[async]>=2.49.1,<3",
    "httpx>=0.28.1,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.10,<0.17",
    "pyrefly>=1.3.2,<1.4",
    "import-linter>=2.15,<3",
    "time-machine>=3.5.1,<4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown: only resolve files uploaded to PyPI at least 7 days ago.
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "movon_hr"  # the distribution is teamku-api, the import package movon_hr

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "FAST",                                 # FastAPI: Annotated, response_model, path params
    "DTZ",                                  # naive datetimes
    "S",                                    # bandit
    "C90", "PLR0911", "PLR0912", "PLR0915", # complexity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/*" = ["N999"]  # date-prefixed revision file names

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder would otherwise count as first-party

[tool.pyrefly]
project-includes = ["src"]
preset = "default"

[tool.importlinter]
root_package = "movon_hr"

[[tool.importlinter.contracts]]
name = "core does not import modules"
type = "forbidden"
source_modules = ["movon_hr.core"]
forbidden_modules = ["movon_hr.modules"]

[[tool.importlinter.contracts]]
name = "no import cycles between modules"
type = "acyclic_siblings"
ancestors = ["movon_hr.modules"]
depth = 0  # only the domain modules themselves, not files inside one module
